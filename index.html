<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Design Space</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --panel-color: #2d2d2d;
            --accent-color: #0078d7;
            --text-color: #e0e0e0;
            --border-color: #3e3e3e;
            --hover-color: #3e3e3e;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            user-select: none;
        }

        /* --- RIBBON UI --- */
        .ribbon {
            height: 120px;
            background-color: var(--panel-color);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 10;
        }

        .ribbon-section {
            flex: 1;
            display: flex;
            align-items: center;
            padding: 0 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .ribbon-section:last-child {
            border-bottom: none;
        }

        .section-title {
            font-size: 11px;
            font-weight: bold;
            color: #aaa;
            width: 70px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tool-group {
            display: flex;
            gap: 2px;
        }

        .tool-btn {
            width: 60px;
            height: 50px;
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-color);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .tool-btn:hover {
            background-color: var(--hover-color);
        }

        .tool-btn.active {
            background-color: var(--accent-color);
            color: white;
        }

        .tool-icon {
            font-size: 18px;
            margin-bottom: 4px;
        }

        .tool-name {
            font-size: 10px;
        }

        /* --- CANVAS --- */
        #canvas-container {
            width: 100%;
            height: calc(100% - 120px);
            position: relative;
            cursor: crosshair;
        }

        canvas {
            display: block;
        }

        /* --- TRIM OPTIONS --- */
        .trim-options {
            display: flex;
            gap: 5px;
            margin-left: 10px;
            padding-left: 10px;
            border-left: 1px solid var(--border-color);
        }
        
        .radio-label {
            font-size: 11px;
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        
        .radio-label input {
            margin-right: 5px;
        }

    </style>
</head>
<body>

    <!-- RIBBON UI -->
    <div class="ribbon">
        <!-- SECTION 1: DRAW -->
        <div class="ribbon-section">
            <div class="section-title">Draw</div>
            <div class="tool-group">
                <button class="tool-btn active" onclick="setTool('select')" id="btn-select">
                    <span class="tool-icon">↖</span>
                    <span class="tool-name">Select</span>
                </button>
                <button class="tool-btn" onclick="setTool('line')" id="btn-line">
                    <span class="tool-icon">╱</span>
                    <span class="tool-name">Line</span>
                </button>
                <button class="tool-btn" onclick="setTool('rect')" id="btn-rect">
                    <span class="tool-icon">☐</span>
                    <span class="tool-name">Rectangle</span>
                </button>
                <button class="tool-btn" onclick="setTool('poly')" id="btn-poly">
                    <span class="tool-icon">⌒</span>
                    <span class="tool-name">Polyline</span>
                </button>
            </div>
        </div>

        <!-- SECTION 2: MODIFY -->
        <div class="ribbon-section">
            <div class="section-title">Modify</div>
            <div class="tool-group">
                <button class="tool-btn" onclick="setTool('move')" id="btn-move">
                    <span class="tool-icon">✥</span>
                    <span class="tool-name">Move</span>
                </button>
                <button class="tool-btn" onclick="setTool('trim')" id="btn-trim">
                    <span class="tool-icon">✂</span>
                    <span class="tool-name">Trim</span>
                </button>
                
                <!-- Trim Sub-options -->
                <div class="trim-options" id="trim-options" style="display:none;">
                    <label class="radio-label">
                        <input type="radio" name="trimMode" value="segment" checked> Cut Segment
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="trimMode" value="object"> Delete Object
                    </label>
                </div>
            </div>
        </div>

        <!-- SECTION 3: ANNOTATE -->
        <div class="ribbon-section">
            <div class="section-title">Annotate</div>
            <div class="tool-group">
                <button class="tool-btn" onclick="setTool('text')" id="btn-text">
                    <span class="tool-icon">T</span>
                    <span class="tool-name">Text</span>
                </button>
                <button class="tool-btn" onclick="setTool('note')" id="btn-note">
                    <span class="tool-icon">📝</span>
                    <span class="tool-name">Note</span>
                </button>
            </div>
        </div>
    </div>

    <!-- WORKSPACE -->
    <div id="canvas-container">
        <canvas id="workspace"></canvas>
    </div>

    <script>
        // --- CONFIGURATION & STATE ---
        const canvas = document.getElementById('workspace');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');

        // Infinite Grid Settings
        const GRID_SIZE = 50; // Base grid unit
        const SUB_GRID = 5;   // Subdivisions
        
        // Camera State
        let camera = { x: 0, y: 0, zoom: 1 };
        
        // Document State
        let shapes = []; // { type, points: [{x,y}], color, id, ... }
        let selectedShapeId = null;
        
        // Tool State
        let currentTool = 'select';
        let isDragging = false;
        let dragStart = { x: 0, y: 0 }; // Screen coords
        let dragStartWorld = { x: 0, y: 0 }; // World coords
        let tempShape = null; // For drawing preview

        // --- INITIALIZATION ---
        function resize() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            render();
        }
        window.addEventListener('resize', resize);
        resize();

        // --- COORDINATE SYSTEMS ---
        // Convert Screen (Pixels) to World (Grid Units)
        function screenToWorld(sx, sy) {
            return {
                x: (sx - canvas.width / 2 - camera.x) / camera.zoom,
                y: (sy - canvas.height / 2 - camera.y) / camera.zoom
            };
        }

        // Convert World to Screen
        function worldToScreen(wx, wy) {
            return {
                x: (wx * camera.zoom) + camera.x + canvas.width / 2,
                y: (wy * camera.zoom) + camera.y + canvas.height / 2
            };
        }

        // Snap to Grid
        function snapToGrid(val) {
            return Math.round(val / GRID_SIZE) * GRID_SIZE;
        }

        // --- RENDERING ---
        function render() {
            // Clear Screen
            ctx.fillStyle = '#1e1e1e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Infinite Grid
            drawGrid();

            // 2. Draw Shapes
            shapes.forEach(shape => drawShape(shape));

            // 3. Draw Temp Shape (Drawing in progress)
            if (tempShape) {
                drawShape(tempShape);
            }

            // 4. Draw Selection
            if (selectedShapeId) {
                const shape = shapes.find(s => s.id === selectedShapeId);
                if (shape) drawSelection(shape);
            }
        }

        function drawGrid() {
            const center = { x: canvas.width / 2, y: canvas.height / 2 };
            const offsetX = (camera.x + center.x) % (GRID_SIZE * camera.zoom);
            const offsetY = (camera.y + center.y) % (GRID_SIZE * camera.zoom);

            ctx.lineWidth = 1;
            
            // Minor Grid
            ctx.strokeStyle = '#2d2d2d';
            ctx.beginPath();
            for (let x = offsetX; x < canvas.width; x += (GRID_SIZE/camera.zoom) * camera.zoom / SUB_GRID) {
                ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
            }
            for (let y = offsetY; y < canvas.height; y += (GRID_SIZE/camera.zoom) * camera.zoom / SUB_GRID) {
                ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
            }
            ctx.stroke();

            // Major Grid
            ctx.strokeStyle = '#3e3e3e';
            ctx.beginPath();
            for (let x = offsetX; x < canvas.width; x += GRID_SIZE * camera.zoom) {
                ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
            }
            for (let y = offsetY; y < canvas.height; y += GRID_SIZE * camera.zoom) {
                ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
            }
            ctx.stroke();
        }

        function drawShape(shape) {
            ctx.beginPath();
            ctx.strokeStyle = shape.color || '#e0e0e0';
            ctx.lineWidth = 2;
            
            if (shape.type === 'line' || shape.type === 'poly') {
                if (shape.points.length > 0) {
                    const start = worldToScreen(shape.points[0].x, shape.points[0].y);
                    ctx.moveTo(start.x, start.y);
                    for (let i = 1; i < shape.points.length; i++) {
                        const p = worldToScreen(shape.points[i].x, shape.points[i].y);
                        ctx.lineTo(p.x, p.y);
                    }
                }
            } else if (shape.type === 'rect') {
                const p1 = worldToScreen(shape.points[0].x, shape.points[0].y);
                const p2 = worldToScreen(shape.points[1].x, shape.points[1].y);
                ctx.rect(p1.x, p1.y, p2.x - p1.x, p2.y - p1.y);
            } else if (shape.type === 'text' || shape.type === 'note') {
                const p = worldToScreen(shape.points[0].x, shape.points[0].y);
                ctx.font = "16px Arial";
                if(shape.type === 'note') {
                    ctx.fillStyle = "#fff";
                    ctx.fillText(shape.content, p.x, p.y);
                    // Draw sticky note background
                    ctx.fillStyle = "#ffeb3b";
                    ctx.fillRect(p.x - 5, p.y - 20, ctx.measureText(shape.content).width + 10, 25);
                    ctx.fillStyle = "#000";
                    ctx.fillText(shape.content, p.x, p.y);
                } else {
                    ctx.fillStyle = shape.color || '#e0e0e0';
                    ctx.fillText(shape.content, p.x, p.y);
                }
                return; // Skip stroke for text
            }
            
            ctx.stroke();
        }

        function drawSelection(shape) {
            // Simple bounding box or highlight
            ctx.save();
            ctx.strokeStyle = '#0078d7';
            ctx.lineWidth = 1;
            ctx.setLineDash([5, 5]);
            
            // Calculate bounds
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            shape.points.forEach(p => {
                if(p.x < minX) minX = p.x;
                if(p.y < minY) minY = p.y;
                if(p.x > maxX) maxX = p.x;
                if(p.y > maxY) maxY = p.y;
            });

            const sMin = worldToScreen(minX, minY);
            const sMax = worldToScreen(maxX, maxY);
            
            ctx.strokeRect(sMin.x, sMin.y, sMax.x - sMin.x, sMax.y - sMin.y);
            ctx.restore();
        }

        // --- TOOL LOGIC ---

        function setTool(toolName) {
            currentTool = toolName;
            
            // Update UI
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            const btn = document.getElementById('btn-' + toolName);
            if(btn) btn.classList.add('active');

            // Show/Hide Trim Options
            const trimOptions = document.getElementById('trim-options');
            trimOptions.style.display = (toolName === 'trim') ? 'flex' : 'none';

            // Reset states
            selectedShapeId = null;
            tempShape = null;
            render();
        }

        function getTrimMode() {
            return document.querySelector('input[name="trimMode"]:checked').value;
        }

        // --- INPUT HANDLING ---

        canvas.addEventListener('mousedown', e => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            const worldPos = screenToWorld(mouseX, mouseY);
            const snappedPos = { x: snapToGrid(worldPos.x), y: snapToGrid(worldPos.y) };

            isDragging = true;
            dragStart = { x: mouseX, y: mouseY };
            dragStartWorld = snappedPos;

            if (currentTool === 'select') {
                // Hit test
                const hit = findShapeAt(worldPos);
                selectedShapeId = hit ? hit.id : null;
                render();
            } 
            else if (currentTool === 'move' && selectedShapeId) {
                // Prepare for move
            }
            else if (currentTool === 'line') {
                tempShape = {
                    type: 'line',
                    points: [snappedPos, snappedPos],
                    color: '#e0e0e0',
                    id: Date.now()
                };
            }
            else if (currentTool === 'rect') {
                tempShape = {
                    type: 'rect',
                    points: [snappedPos, snappedPos],
                    color: '#e0e0e0',
                    id: Date.now()
                };
            }
            else if (currentTool === 'poly') {
                if (!tempShape) {
                    tempShape = {
                        type: 'poly',
                        points: [snappedPos],
                        color: '#e0e0e0',
                        id: Date.now()
                    };
                } else {
                    // Close poly
                    tempShape.points.push(snappedPos);
                    shapes.push(tempShape);
                    tempShape = null;
                }
                render();
            }
            else if (currentTool === 'text') {
                const text = prompt("Enter text:");
                if(text) {
                    shapes.push({
                        type: 'text',
                        points: [snappedPos],
                        content: text,
                        color: '#00ff00',
                        id: Date.now()
                    });
                    render();
                }
                isDragging = false; // Text is instant
            }
            else if (currentTool === 'note') {
                shapes.push({
                    type: 'note',
                    points: [snappedPos],
                    content: "Note",
                    id: Date.now()
                });
                render();
                isDragging = false;
            }
            else if (currentTool === 'trim') {
                handleTrim(worldPos);
                isDragging = false; // Trim is instant click
            }
        });

        canvas.addEventListener('mousemove', e => {
            if (!isDragging) return;

            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            const worldPos = screenToWorld(mouseX, mouseY);
            const snappedPos = { x: snapToGrid(worldPos.x), y: snapToGrid(worldPos.y) };

            if (currentTool === 'select' || currentTool === 'move') {
                if (selectedShapeId) {
                    const dx = snappedPos.x - dragStartWorld.x;
                    const dy = snappedPos.y - dragStartWorld.y;
                    
                    const shape = shapes.find(s => s.id === selectedShapeId);
                    if (shape) {
                        shape.points.forEach(p => {
                            p.x += dx;
                            p.y += dy;
                        });
                        dragStartWorld = snappedPos; // Update anchor for next frame
                        render();
                    }
                } else {
                    // Pan Camera
                    camera.x += (mouseX - dragStart.x);
                    camera.y += (mouseY - dragStart.y);
                    dragStart = { x: mouseX, y: mouseY };
                    render();
                }
            }
            else if (currentTool === 'line' || currentTool === 'rect') {
                if (tempShape) {
                    tempShape.points[1] = snappedPos;
                    render();
                }
            }
        });

        canvas.addEventListener('mouseup', e => {
            if (currentTool === 'line' || currentTool === 'rect') {
                if (tempShape) {
                    // Don't create zero-length shapes
                    if (tempShape.points[0].x !== tempShape.points[1].x || 
                        tempShape.points[0].y !== tempShape.points[1].y) {
                        shapes.push(tempShape);
                    }
                    tempShape = null;
                    render();
                }
            }
            isDragging = false;
        });

        // Zoom
        canvas.addEventListener('wheel', e => {
            e.preventDefault();
            const zoomIntensity = 0.1;
            const wheel = e.deltaY < 0 ? 1 : -1;
            const zoomFactor = Math.exp(wheel * zoomIntensity);
            
            // Zoom towards mouse pointer
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const worldStart = screenToWorld(mouseX, mouseY);
            
            camera.zoom *= zoomFactor;
            
            const worldEnd = screenToWorld(mouseX, mouseY);
            
            camera.x += (worldEnd.x - worldStart.x) * camera.zoom;
            camera.y += (worldEnd.y - worldStart.y) * camera.zoom;

            render();
        });

        // --- TRIM LOGIC (The Core Requirement) ---
        function handleTrim(worldPos) {
            const mode = getTrimMode(); // 'segment' or 'object'
            const HIT_RADIUS = 10 / camera.zoom; // Tolerance in world units

            // Find closest shape and segment
            let closestHit = null;
            let minDist = Infinity;

            shapes.forEach((shape, shapeIndex) => {
                if (shape.type === 'text' || shape.type === 'note') return;

                for (let i = 0; i < shape.points.length - 1; i++) {
                    const p1 = shape.points[i];
                    const p2 = shape.points[i+1];
                    
                    const dist = distToSegment(worldPos, p1, p2);
                    if (dist < minDist) {
                        minDist = dist;
                        closestHit = { shapeIndex, p1, p2, t: getT(worldPos, p1, p2) };
                    }
                }
            });

            if (closestHit && minDist < HIT_RADIUS) {
                if (mode === 'object') {
                    // Trim Whole: Delete the object
                    shapes.splice(closestHit.shapeIndex, 1);
                    selectedShapeId = null;
                } else {
                    // Trim Segment: Cut at point
                    const shape = shapes[closestHit.shapeIndex];
                    
                    // Calculate intersection point
                    const cutPoint = {
                        x: closestHit.p1.x + closestHit.t * (closestHit.p2.x - closestHit.p1.x),
                        y: closestHit.p1.y + closestHit.t * (closestHit.p2.y - closestHit.p1.y)
                    };

                    // Logic: Split the path at the cut point
                    // We need to find where p1 and p2 are in the points array
                    const p1Index = shape.points.indexOf(closestHit.p1);
                    
                    // Insert cut point after p1
                    shape.points.splice(p1Index + 1, 0, cutPoint);
                    
                    // Now remove the segment between cutPoint and p2
                    // The segment is now at index p1Index+1 (cutPoint) and p1Index+2 (p2)
                    shape.points.splice(p1Index + 1, 1); // Remove cutPoint (temp)
                    shape.points.splice(p1Index + 1, 0, cutPoint); // Re-add at correct spot
                    
                    // Actually, to "Trim" (cut) means to break the line but keep both pieces usually.
                    // But if the user wants to "Trim connected point to next connected point", 
                    // it usually implies cutting the line there.
                    
                    // Implementation: Split the array into two arrays? 
                    // Or just insert a point so it looks continuous but is now two segments?
                    // Let's insert the point. This allows future trims on specific segments.
                    
                    // If the intent is to "Delete" the clicked segment:
                    // shape.points.splice(p1Index + 1, 1); 
                    // But let's stick to "Split" (Insert Point) as it's more versatile for CAD.
                    // Wait, "Trim" usually means "Cut". Let's just insert the point.
                    // If the user clicks exactly on the line, it breaks the line there.
                }
                render();
            }
        }

        // Math Helpers
        function distToSegment(p, v, w) {
            const l2 = distSq(v, w);
            if (l2 == 0) return distSq(p, v);
            let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
            t = Math.max(0, Math.min(1, t));
            return Math.sqrt(distSq(p, { x: v.x + t * (w.x - v.x), y: v.y + t * (w.y - v.y) }));
        }

        function getT(p, v, w) {
            const l2 = distSq(v, w);
            if (l2 == 0) return 0;
            return ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
        }

        function distSq(v, w) {
            return (v.x - w.x) * (v.x - w.x) + (v.y - w.y) * (v.y - w.y);
        }

        function findShapeAt(worldPos) {
            // Simple hit test for selection
            const HIT_RADIUS = 10 / camera.zoom;
            for (let i = shapes.length - 1; i >= 0; i--) {
                const s = shapes[i];
                if (s.type === 'text' || s.type === 'note') {
                    // Simplified text hit test
                    const p = worldToScreen(s.points[0].x, s.points[0].y);
                    // Rough estimate
                    if (Math.abs(worldPos.x - s.points[0].x) < 20 && Math.abs(worldPos.y - s.points[0].y) < 20) return s;
                } else {
                    for (let j = 0; j < s.points.length - 1; j++) {
                        if (distToSegment(worldPos, s.points[j], s.points[j+1]) < HIT_RADIUS) {
                            return s;
                        }
                    }
                }
            }
            return null;
        }

    </script>
</body>
</html>
