<!-- PROFESSIONAL RIBBON -->
<div class="ribbon-container">

    <!-- TAB HEADER -->
    <div class="ribbon-tabs">
        <div class="tab active" data-tab="home">Home</div>
        <div class="tab" data-tab="insert">Insert</div>
        <div class="tab" data-tab="modify">Modify</div>
        <div class="tab" data-tab="view">View</div>
    </div>

    <!-- TAB CONTENT -->
    <div class="ribbon-content">

        <!-- HOME TAB -->
        <div class="ribbon-panel active" id="home">

            <div class="ribbon-group">
                <div class="group-title">Draw</div>
                <button class="ribbon-btn">Line</button>
                <button class="ribbon-btn">Circle</button>
                <button class="ribbon-btn">Rectangle</button>
            </div>

            <div class="ribbon-group">
                <div class="group-title">Modify</div>
                <button class="ribbon-btn">Trim</button>
                <button class="ribbon-btn">Move</button>
                <button class="ribbon-btn">Rotate</button>
            </div>

            <div class="ribbon-group">
                <div class="group-title">Clipboard</div>
                <button class="ribbon-btn">Undo</button>
                <button class="ribbon-btn">Redo</button>
            </div>

        </div>

        <!-- INSERT TAB -->
        <div class="ribbon-panel" id="insert">
            <div class="ribbon-group">
                <div class="group-title">Insert</div>
                <button class="ribbon-btn">Image</button>
                <button class="ribbon-btn">Block</button>
            </div>
        </div>

        <!-- MODIFY TAB -->
        <div class="ribbon-panel" id="modify">
            <div class="ribbon-group">
                <div class="group-title">Advanced Modify</div>
                <button class="ribbon-btn">Offset</button>
                <button class="ribbon-btn">Mirror</button>
                <button class="ribbon-btn">Scale</button>
            </div>
        </div>

        <!-- VIEW TAB -->
        <div class="ribbon-panel" id="view">
            <div class="ribbon-group">
                <div class="group-title">View Controls</div>
                <button class="ribbon-btn">Zoom In</button>
                <button class="ribbon-btn">Zoom Out</button>
                <button class="ribbon-btn">Reset View</button>
            </div>
        </div>

    </div>
</div>
